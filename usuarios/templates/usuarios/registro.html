{% extends "base.html" %}
{% block title %}Registro · InvenShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-4">Crear cuenta</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_campos.html" %}
      <button type="submit" class="btn btn-primary w-100">Registrarme</button>
    </form>
    <p class="mt-3 text-center">¿Ya tenés cuenta? <a href="{% url 'usuarios:login' %}">Iniciá sesión</a></p>
  </div>
</div>
{% endblock %}
