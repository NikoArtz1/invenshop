{% extends "base.html" %}
{% block title %}Cambiar contraseña · InvenShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-4">Cambiar contraseña</h1>
    <form method="post">
      {% csrf_token %}
      {% include "partials/form_campos.html" %}
      <button type="submit" class="btn btn-primary">Actualizar</button>
      <a href="{% url 'usuarios:perfil' %}" class="btn btn-link">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
