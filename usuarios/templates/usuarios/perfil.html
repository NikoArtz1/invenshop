{% extends "base.html" %}
{% block title %}Mi perfil · InvenShop{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-1">Mi perfil</h1>
    <p class="text-muted">{{ user.email }}</p>
    <form method="post">
      {% csrf_token %}
      {% include "partials/form_campos.html" %}
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <a href="{% url 'usuarios:cambiar_password' %}" class="btn btn-link">Cambiar contraseña</a>
    </form>
  </div>
</div>
{% endblock %}
