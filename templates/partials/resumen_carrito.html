<table class="table table-sm align-middle">
  <thead>
    <tr><th>Producto</th><th class="text-center">Cant.</th><th class="text-end">Subtotal</th></tr>
  </thead>
  <tbody>
    {% for l in lineas %}
    <tr>
      <td>
        {{ l.producto.nombre }}
        {% if not l.disponible %}
          <div class="text-danger small">Stock insuficiente (quedan {{ l.producto.stock }})</div>
        {% endif %}
      </td>
      <td class="text-center">{{ l.cantidad }}</td>
      <td class="text-end">${{ l.subtotal }}</td>
    </tr>
    {% endfor %}
  </tbody>
  <tfoot>
    <tr><th colspan="2" class="text-end">Total</th><th class="text-end">${{ total }}</th></tr>
  </tfoot>
</table>
